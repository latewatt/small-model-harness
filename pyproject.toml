[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "small-model-harness"
version = "0.1.0"
description = "A measured, local-first coding-agent harness and benchmark rig"
requires-python = ">=3.12"
dependencies = ["mini-swe-agent==2.4.6"]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]
terminal = ["harbor==0.25.0"]

[project.scripts]
small-harness = "harness.cli:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
